[package]
name = "xui-icons"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Global Village: a 90s-flavoured, multi-colour vector icon set for xui, drawn through the portable Canvas"
repository = "https://github.com/va1erian/xui"
readme = "README.md"
# The raster and .ico exports are for people, not for the crate: the drawn
# shapes are compiled into `src/village` and `src/aero`.
exclude = ["assets/*/png", "assets/*/ico"]

[features]
# Build the glossy Vista-era "Aero" artwork instead of the default Global
# Village one. Only the chosen style's data is compiled in.
aero = []

[dependencies]
xui-core = { path = "../xui-core" }

[dev-dependencies]
xui-canvas = { path = "../xui-canvas" }
