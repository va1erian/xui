[package]
name = "xui-d2d"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Lightweight Windows backend for xui: one Win32 window per xui window, drawn with Direct2D and DirectWrite"
repository = "https://github.com/va1erian/xui"

[dependencies]
xui-core = { path = "../xui-core" }

[target.'cfg(windows)'.dependencies]
# `Vector2`/`Matrix3x2`, the point and transform types Direct2D takes, live here
# rather than in `windows`.
windows-numerics = "0.3"
# One feature per Win32 namespace actually used, so the generated bindings (and
# the binary) stay small.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
