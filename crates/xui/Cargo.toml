[package]
name = "xui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform UI for Rust: small, fast, idiomatic and properly themed"
repository = "https://github.com/va1erian/xui"
readme = "README.md"

[features]
default = ["canvas"]
# The software-rendered, cross-platform backend (winit + tiny-skia). On by
# default: it builds and runs on every platform.
canvas = ["dep:xui-canvas"]
# The Windows-only backend: native window chrome, Direct2D/DirectWrite
# painting, GDI fallback. Opt in for higher-fidelity/perf Windows apps.
d2d = ["dep:xui-win32"]
# The optional Global Village icon set (`xui::xui_icons`).
icons = ["dep:xui-icons"]

[dependencies]
xui-core = { path = "../xui-core" }
xui-win32 = { path = "../xui-win32", optional = true }
xui-canvas = { path = "../xui-canvas", optional = true }
xui-icons = { path = "../xui-icons", optional = true }

