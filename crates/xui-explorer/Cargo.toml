[package]
name = "xui-explorer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A portable spatial file explorer core for xui, with all OS specifics behind small traits"
repository = "https://github.com/va1erian/xui"
readme = "README.md"

[dependencies]
xui-core = { path = "../xui-core" }
# The optional Global Village multi-colour icon set. Off for a target that
# prefers the single-colour Lucide fallback (or cannot afford the crate).
xui-icons = { path = "../xui-icons", optional = true }

[features]
# The std-backed `Platform`/`Launcher` (`StdPlatform`, `DesktopLauncher`). Off
# for a target with its own filesystem and shell, such as LazyOS.
default = ["std-platform", "village-icons"]
std-platform = []
# Draw tiles with the multi-colour Global Village icons instead of Lucide.
village-icons = ["dep:xui-icons"]

[dev-dependencies]
xui-canvas = { path = "../xui-canvas" }

[[example]]
name = "explorer"
required-features = ["std-platform"]
