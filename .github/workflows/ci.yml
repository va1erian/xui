name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The full toolkit on Windows: the platform backend, every widget, every UI
  # test (windows are allowed on a runner), formatting and lints.
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The software backend and its cross-platform gallery are behind the
      # off-by-default `canvas` feature.
      - run: cargo check -p xui --features canvas --all-targets
      - run: cargo clippy -p xui --features canvas --all-targets -- -D warnings
      - run: cargo test -p xui-canvas

  # The occlusion-proof capture backend is behind the off-by-default `wgc`
  # feature, so it needs its own build and test pass. Tests that require a real
  # capture device skip on `Unavailable`/`DeviceLost`.
  check-wgc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --features wgc
      - run: cargo clippy --all-targets --features wgc -- -D warnings
      - run: cargo test --features wgc

  # The backend-agnostic core must build and its headless tests pass on Linux,
  # proving the front layer has no Win32 dependency. The whole workspace is
  # checked so the empty backend still compiles elsewhere.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo clippy -p xui-core --all-targets -- -D warnings
      - run: cargo test -p xui-core
      # The software backend must build and its non-window tests pass here too.
      - run: cargo test -p xui-canvas

  # The same portable guarantee on macOS (the future home of a native backend).
  cross-check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo test -p xui-core
      - run: cargo test -p xui-canvas
