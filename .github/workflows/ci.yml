name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR/branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No incremental artifacts in CI (they bloat the cache and never get reused),
  # and no debuginfo: it dominates link time and target size on Windows.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  # Formatting and lints run in parallel with the tests. Clippy is a superset of
  # `cargo check`, so no separate check step; `--all-features` covers the d2d,
  # canvas and wgc backends (the umbrella's default already includes canvas).
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings

  # The full toolkit on Windows: the platform backend, every widget and every UI
  # test (windows are allowed on a runner). The all-features test pass (d2d +
  # canvas + wgc) runs in `coverage`, so it is not repeated here.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test
      # The editor's Rhai lexer is an opt-in feature its tests need.
      - run: cargo test -p xui-code-editor --features rhai-syntax
      # The window-level GL path is opt-in (it needs an OpenGL driver). Run it
      # explicitly so a regression is CI-visible; on a runner without a driver
      # the test skips cleanly, but the step still attempts it.
      - run: cargo test -p xui-canvas --test gl
        env:
          XUI_CANVAS_GL_TEST: "1"
      # Compilation of every example is covered by `cargo test`; run the
      # runnable ones with an auto-close so a panic-on-startup or a paint
      # regression is visible rather than only a compile error.
      # (The `gl` example is left to the opt-in GL test: a runner without a real
      # driver can hand back a half-loaded context that the example, unlike the
      # test, does not guard against.)
      - run: cargo run -p xui --features canvas --example widgets
        env:
          XUI_DEMO_AUTOCLOSE_MS: "4000"

  # The backend-agnostic core must build and its headless tests pass on Linux,
  # proving the front layer has no Win32 dependency. The whole workspace is
  # checked so the empty backend still compiles elsewhere.
  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets
      - run: cargo clippy -p xui-core --all-targets -- -D warnings
      - run: cargo test -p xui-core
      - run: cargo test -p xui-code-editor --features rhai-syntax
      # The software backend must build and its non-window tests pass here too.
      - run: cargo test -p xui-canvas
      # The web view as LazyOS builds it: static musl, no system fonts, nothing
      # but Rust (LazyOS links it with rust-lld, with no C compiler).
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo check -p xui-blitz --no-default-features --target x86_64-unknown-linux-musl

  # Every example rendered headlessly, light and dark, so each PR has a
  # screenshot set to look at without a desktop or the sandbox. Not a required
  # check: it publishes images, it does not gate the merge.
  snapshots:
    runs-on: ubuntu-latest
    # It runs code from the PR, so it gets a read-only token and no persisted
    # checkout credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/snapshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: target/snapshots/
          if-no-files-found: error

  # The same portable guarantee on macOS (the future home of a native backend).
  cross-check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-targets
      - run: cargo test -p xui-core
      - run: cargo test -p xui-canvas
      # The software backend and its gallery must build for a Mac (winit +
      # softbuffer + tiny-skia); the app itself only runs in a GUI session.
      - run: cargo check -p xui --features canvas --example widgets

  # Source-based coverage of the full suite (GUI tests need a desktop, so this
  # runs on Windows). The LCOV file is uploaded to Codecov and kept as an
  # artifact for the HTML report.
  coverage:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
      # `use_oidc` works for a public repo without a token; `fail_ci_if_error`
      # keeps a Codecov outage from failing the build.
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
